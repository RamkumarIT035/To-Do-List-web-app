<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>TaskFlow</h1>
                <p class="description">Organize your day, one task at a time.</p>
            </div>

            <div class="progress-box">
                <div class="progress-circle">
                    <span id="progressPercent">0%</span>
                </div>
            </div>
        </header>

        <section class="task-input-section">

            <input
                type="date"
                id="dateInput"
            >

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button id="addButton">
                <span id="buttonIcon">+</span>
                <span id="buttonText">Add Task</span>
            </button>

            <button id="cancelButton" class="cancel-btn hidden">
                Cancel
            </button>

        </section>

        <div class="search-box">
            <span class="search-icon">⌕</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >
        </div>

        <div class="toolbar">

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>

            <button id="clearCompleted" class="clear-btn">
                Clear completed
            </button>

        </div>

        <div class="stats">

            <div class="stat">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>

            <div class="stat">
                <span id="activeTasks">0</span>
                <small>Active</small>
            </div>

            <div class="stat">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

        </div>

        <ul id="taskList"></ul>

        <div id="emptyState" class="empty-state">
            <div class="empty-icon">✓</div>
            <h2>No tasks found</h2>
            <p>Add a task and start getting things done.</p>
        </div>

    </div>

    <dialog id="statusDialog" aria-labelledby="statusDialogTitle">
        <h2 id="statusDialogTitle">Update task status</h2>
        <p>Should this task be complete or incomplete?</p>
        <div class="status-dialog-actions">
            <button id="completeUpdateButton" class="status-choice complete-choice" type="button">
                Complete
            </button>
            <button id="incompleteUpdateButton" class="status-choice" type="button">
                Incomplete
            </button>
            <button id="cancelUpdateButton" class="status-choice cancel-choice" type="button">
                Cancel
            </button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
